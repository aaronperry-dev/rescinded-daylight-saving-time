[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescinded-dst"
version = "0.1.0"
description = "Pipeline + swipe map comparing CONUS time zones with and without Daylight Saving Time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "shapely>=2.1",   # coverage_simplify needs GEOS >= 3.12
    "pillow>=10",
    "requests>=2.31",
    "contourpy>=1.2",
    "ijson>=3.2",     # stream the 170 MB boundary file instead of loading it whole
    "tzdata>=2024.1", # IANA rules for zoneinfo on platforms without a system tz database
    "netCDF4>=1.6",   # read the ETOPO elevation/bathymetry grid (OPeNDAP subset or local file)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rdst = "rdst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdst = ["web/*", "web/vendor/leaflet/*", "web/vendor/leaflet/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
